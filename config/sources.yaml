# Real-world sources for post types that must not be invented.

# 1. Founder questions: top posts of the week from these subreddits (RSS).
reddit:
  subreddits: [smallbusiness, SideProject, AI_Agents, ChatGPT, automation, ProductivityApps, nocode,
               Entrepreneur, startups, indiehackers, indianstartups, ArtificialInteligence, productivity,
               EntrepreneurRideAlong, Startup_Ideas, growmybusiness, micro_saas, StartUpIndia]
  min_score: 7          # 1-10: genuine, relatable founder question we can answer well
  min_chars: 200        # question + body text needed

